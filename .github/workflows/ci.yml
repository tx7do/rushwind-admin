name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # The framework monorepo (rushwind crates, rust-utils) is consumed
      # through git dependencies pinned by rev — cargo fetches them
      # directly; no sibling checkout or layout assumptions.

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # admin-proto's build script compiles the annotated closure through
      # `buf build` (backend/api/buf.yaml workspace) — buf preserves the
      # custom-option bytes (google.api.http / errors.code / gnostic / redact)
      # that protox's serializer drops, replacing the former protoc dependency.
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"

      # Vendored protos must match MANIFEST.sha256 (anti-tamper gate).
      # The go source repo is absent on CI, so the upstream-drift
      # comparison self-skips inside the script (exit 0); drift
      # acceptance happens on dev machines where both repos exist.
      - name: Proto contract gate (MANIFEST consistency)
        run: bash api/sync-protos.sh --check

      # Frontend snapshots must match <frontend>.MANIFEST.sha256 (anti-tamper
      # gates). The upstream source repo is absent on CI, so the drift
      # comparison self-skips inside the script, same as the proto gate.
      - name: Frontend snapshot gate (MANIFEST consistency)
        run: |
          bash ../frontend/admin/sync-frontend.sh react --check
          bash ../frontend/admin/sync-frontend.sh vue-element --check
          bash ../frontend/admin/sync-frontend.sh vue-vben --check

      # Report, not a gate: the vendored Kratos-style contract violates buf
      # STANDARD naming lints wholesale (snapshots are byte-frozen; findings
      # belong upstream). Surfaced to catch NEW violation classes on re-sync.
      - name: Buf lint (report)
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: backend/api
        run: buf lint

      # Scoped to THIS repo's packages: `cargo fmt --all` would also
      # enforce on the framework path-deps, which the framework repo's
      # own CI owns.
      - name: Format
        run: cargo fmt -p proto -p auth -p admin-api -p admin-diff -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
