[package]
name = "admin-api"
description = "The admin service: a thin assembly binary over the admin-api library (config, state, service implementations, REST/SSE/task transports) over the shared db and proto crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
proto = { path = "../../crates/proto" }
auth = { path = "../../crates/auth" }
rushwind-authn = { git = "https://github.com/tx7do/rushwind", rev = "08fbfcd" }
rushwind-authn-jwt = { git = "https://github.com/tx7do/rushwind", rev = "08fbfcd" }
rushwind-bootstrap = { git = "https://github.com/tx7do/rushwind", rev = "08fbfcd" }
rushwind-http-binding = { git = "https://github.com/tx7do/rushwind", rev = "08fbfcd" }
rushwind-storage-seaorm-support = { git = "https://github.com/tx7do/rushwind", rev = "08fbfcd" }
rushwind-oss-local = { git = "https://github.com/tx7do/rushwind", rev = "08fbfcd" }
rushwind-transport-sse = { git = "https://github.com/tx7do/rushwind", rev = "08fbfcd" }
rushwind-oss = { git = "https://github.com/tx7do/rushwind", rev = "08fbfcd" }
rushwind-oss-s3 = { git = "https://github.com/tx7do/rushwind", rev = "08fbfcd" }
rushwind-transport-cron = { workspace = true }
rushwind-apalis-postgres = { git = "https://github.com/tx7do/rushwind", rev = "08fbfcd" }
apalis-core = { workspace = true }
rushwind-transport = { git = "https://github.com/tx7do/rushwind", rev = "08fbfcd" }
rushwind-transport-axum = { git = "https://github.com/tx7do/rushwind", rev = "08fbfcd" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json", "matched-path"] }
tokio = { workspace = true }
sea-orm = { workspace = true }
rushwind-storage-seaorm-migration = { git = "https://github.com/tx7do/rushwind", rev = "08fbfcd" }
redis = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
bcrypt = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
hmac = { workspace = true }
aes-gcm = { workspace = true }
rsa = { workspace = true }
lol_html = { workspace = true }
lettre = { workspace = true }
base64 = { workspace = true }
pbjson-types = { workspace = true }
rust-utils = { workspace = true }
captcha = { workspace = true }
futures-util = { workspace = true }
qrcode = "0.14"
hex = { workspace = true }
reqwest = { workspace = true }
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
async-trait = { workspace = true }
prost-reflect = { workspace = true }
