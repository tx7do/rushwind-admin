syntax = "proto3";

package notice.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/protobuf/timestamp.proto";

// 公告实体与请求/答复形态。字段号约定与上游契约树一致：
// 1-99 业务位；100+ 审计人；200+ 时间戳。
//
// 目录约定：领域契约（message + 请求/答复）住本文件；带 google.api.http
// 注解、真正生成路由的 BFF service 住 i_notice.proto；错误枚举住
// notice_error.proto。

// 公告
message Notice {
  optional uint64 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {
      description: "公告ID"
    }
  ]; // 公告ID

  optional uint64 tenant_id = 2 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {
      description: "所属租户ID"
    }
  ]; // 所属租户ID

  optional string title = 3 [
    json_name = "title",
    (gnostic.openapi.v3.property) = {
      description: "公告标题"
    }
  ]; // 公告标题

  optional string content = 4 [
    json_name = "content",
    (gnostic.openapi.v3.property) = {
      description: "公告正文"
    }
  ]; // 公告正文

  optional bool is_published = 5 [
    json_name = "isPublished",
    (gnostic.openapi.v3.property) = {
      description: "是否已发布"
    }
  ]; // 是否已发布

  optional google.protobuf.Timestamp published_at = 6 [
    json_name = "publishedAt",
    (gnostic.openapi.v3.property) = {
      description: "发布时间"
    }
  ]; // 发布时间

  optional uint32 sort_order = 7 [
    json_name = "sortOrder",
    (gnostic.openapi.v3.property) = {description: "排序顺序，值越小越靠前"}
  ]; // 排序顺序，值越小越靠前

  optional uint64 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者ID"}]; // 创建者ID
  optional uint64 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者ID"}]; // 更新者ID
  optional uint64 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}]; // 删除时间
}

// 公告列表 - 答复
message ListNoticeResponse {
  repeated Notice items = 1;
  uint64 total = 2;
}

// 公告详情 - 请求（id 经 HTTP 路径变量绑定）
message GetNoticeRequest {
  uint64 id = 1;
}

// 创建公告 - 请求
message CreateNoticeRequest {
  Notice data = 1;
}

// 更新公告 - 请求（id 经 HTTP 路径变量绑定）
message UpdateNoticeRequest {
  uint64 id = 1;
  Notice data = 2;
}

// 删除公告 - 请求（id 经 HTTP 路径变量绑定）
message DeleteNoticeRequest {
  uint64 id = 1;
}
