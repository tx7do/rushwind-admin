[package]
name = "auth"
description = "The protected-subtree auth gate: credential verification through the framework engine contract, failures rendered as the four-field status envelope with the admin error tables' UNAUTHORIZED pairing and the pinned message literals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
proto = { path = "../proto" }
rushwind-authn = { git = "https://github.com/tx7do/rushwind", rev = "a344105bda4475b42a3b3feaf8782147895b10e6" }
rushwind-authn-gate = { git = "https://github.com/tx7do/rushwind", rev = "a344105bda4475b42a3b3feaf8782147895b10e6" }
rushwind-http-binding = { git = "https://github.com/tx7do/rushwind", rev = "a344105bda4475b42a3b3feaf8782147895b10e6" }
axum = { version = "0.8", default-features = false, features = ["matched-path"] }
