# buf 工作区——契约树 + BSR 依赖，无 vendored 第三方：
#
#   cd backend/api
#   buf lint                              # 样式报告（仅契约树；快照禁手改，
#                                         #   发现的问题回上游 go-wind-admin 修）
#   buf build -o /tmp/api-image.binpb     # 编译全工作区（含注解闭包，选项字节保真；
#                                         #   首次构建会按 buf.lock 拉取六个依赖模块
#                                         #   进模块缓存，之后离线可用）
#   buf breaking --against "../../.git#branch=main,subdir=backend/api"
#                                         # 再同步接受新 vintage 前的契约演进检查
#                                         #   （工作区对工作区；基线要求 buf.yaml
#                                         #    已入库；FILE 规则下仅删除/改型算破坏）
#
# 契约源字节同步自上游 go-wind-admin（api/sync-protos.sh + MANIFEST.sha256 门），
# 因此这里【不做】buf format（会砸字节清单门）。第三方注解声明不再 vendor 进仓：
# 六个 BSR 模块由 deps 声明、由 buf.lock 钉定 commit——buf.lock 与上游
# go-wind-admin/backend/api/buf.lock 同源（上游 lock 是唯一版本事实源；再同步时
# 比对两边 commit 即可）。import 按模块根相对路径解析，与契约树的写法天然同构；
# google/protobuf 由 buf 内置 WKT 解析。
version: v2

modules:
  # 契约树：149 个 proto，字节同步快照（api/MANIFEST.sha256 门）。
  - path: protos
    lint:
      use:
        - STANDARD

deps:
  - 'buf.build/googleapis/googleapis'        # google.api.http / field_behavior / HttpBody
  - 'buf.build/kratos/apis'                  # (errors.code) reason→HTTP 状态注解
  - 'buf.build/tx7do/pagination'             # go-crud PagingRequest（列请求信封）
  - 'buf.build/envoyproxy/protoc-gen-validate' # PGV 校验注解声明
  - 'buf.build/gnostic/gnostic'              # OpenAPI 扩展注解（免鉴权端点标注）
  - 'buf.build/go-wind/redact'               # 静态脱敏注解声明

breaking:
  use:
    - FILE
