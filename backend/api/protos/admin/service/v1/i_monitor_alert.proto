syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "monitor_alert/service/v1/monitor_alert.proto";
import "notification/service/v1/notification.proto";

import "pagination/v1/pagination.proto";

// 监控告警规则服务（平台管理员）
service MonitorAlertService {
  // 规则列表（分页，contains 搜索）
  rpc ListMonitorAlertRule(pagination.PagingRequest) returns (monitor_alert.service.v1.ListMonitorAlertRuleResponse) {
    option (google.api.http) = {
      get: "/admin/v1/monitor-alert-rules"
    };
  }

  // 规则详情
  rpc GetMonitorAlertRule(monitor_alert.service.v1.GetMonitorAlertRuleRequest) returns (monitor_alert.service.v1.MonitorAlertRule) {
    option (google.api.http) = {
      get: "/admin/v1/monitor-alert-rules/{id}"
    };
  }

  // 新建规则
  rpc CreateMonitorAlertRule(monitor_alert.service.v1.CreateMonitorAlertRuleRequest) returns (monitor_alert.service.v1.MonitorAlertRule) {
    option (google.api.http) = {
      post: "/admin/v1/monitor-alert-rules"
      body: "*"
    };
  }

  // 更新规则
  rpc UpdateMonitorAlertRule(monitor_alert.service.v1.UpdateMonitorAlertRuleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/monitor-alert-rules/{id}"
      body: "*"
    };
  }

  // 删除规则
  rpc DeleteMonitorAlertRule(monitor_alert.service.v1.DeleteMonitorAlertRuleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/monitor-alert-rules/{id}"
    };
  }

  // 立即评估一轮（与周期扫描同一内核），返回各启用规则的求值结论
  rpc EvaluateMonitorAlerts(monitor_alert.service.v1.EvaluateMonitorAlertsRequest) returns (monitor_alert.service.v1.EvaluateMonitorAlertsResponse) {
    option (google.api.http) = {
      post: "/admin/v1/monitor-alert-rules:evaluate"
      body: "*"
    };
  }
}
