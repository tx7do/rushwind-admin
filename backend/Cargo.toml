[workspace]
resolver = "2"
members = ["crates/*", "services/*", "testbed/admin-diff"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"

# Workspace-wide lint baseline; member crates opt in via
# `[lints] workspace = true`.
[workspace.lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
# proto 类型链——版本与 rushwind 工作区保持一致（prost 0.14 / pbjson 0.9 / protox 0.9）。
prost = "0.14"
prost-build = "0.14"
pbjson = "0.9"
pbjson-types = "0.9"
pbjson-build = "0.9"
protox = "0.9"
serde = "1"
serde_json = "1"
# 生成器与运行时 schema 面：prost-reflect（描述符池 + 动态消息 + 扩展选项解码）。
prost-reflect = { version = "0.16", features = ["serde"] }
# 生成器产物中的服务 trait 用 async-trait 保证 dyn 兼容。
async-trait = "0.1"
# 管理服务直用的工具链：Django 风格 query 解析。
rust-utils = { git = "https://github.com/tx7do/rust-utils", rev = "5023c3f9c4bdb37f3d44eafdb1d538e48917c5ba", features = [
    "json",
    "otp",
    "crypto",
    "printrender",
] }
# captcha 图像渲染。
captcha = "0.0.9"
sha1 = "0.10"
# binder 叶子解码：std base64 与 RFC3339 时间戳解析。
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# 存储面（版本与 rushwind 工作区一致；with-chrono/with-json 供实体时间戳/JSONB 列）。
sea-orm-migration = { version = "2.0", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
] }
sea-orm = { version = "2.0", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "macros",
    "with-chrono",
    "with-json",
] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
futures-util = "0.3"
# 任务队列：apalis Postgres 后端 + worker runtime 门面。
rushwind-transport-cron = { git = "https://github.com/tx7do/rushwind", rev = "a344105bda4475b42a3b3feaf8782147895b10e6" }
rushwind-apalis-postgres = { git = "https://github.com/tx7do/rushwind", rev = "a344105bda4475b42a3b3feaf8782147895b10e6" }
apalis-core = { version = "0.7", features = ["json", "sleep"] }
bcrypt = "0.15"
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
sha2 = "0.10"
hmac = "0.12"
# 口令传输混合信封（P1-12）：RSA-2048 OAEP(SHA-256) 包裹 AES-256-GCM 会话密钥。
rsa = { version = "0.9", features = ["pem"] }
# 打印渲染 HTML 清洗（P1-11）：流式重写器剥脚本/嵌入与事件属性。
lol_html = "1"
# 出站 SMTP（通知 EMAIL 渠道）：lettre SMTP + native-tls（与 reqwest 同栈）。
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "native-tls",
    "tokio1",
    "tokio1-native-tls",
] }
uuid = { version = "1", features = ["v4", "v7"] }
rand = "0.9"
hex = "0.4"
serde_yaml = "0.9"
# 出站 HTTP（OIDC SSO 登录链路：discovery/token/userinfo；版本与 rushwind 工作区一致）。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = "thin"

# Windows MSVC 的 PDB 有 4GB 上限：debug 全量调试信息链接即爆（LNK1140）。
# 行号表保留回溯能力，类型级调试信息让给 release/需要时手动开。
[profile.dev]
debug = "line-tables-only"

