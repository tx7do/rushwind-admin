[package]
name = "admin"
description = "The rushwind admin application: one crate, one binary, the whole product — the synced admin surface (the 41 services over the route-pack edge, audit, SSE, tasks) and the fork's business modules assemble here over one contract workspace, one auth gate, one audit layer, one lifecycle. Upstream sync lands in src/admin and the api/ admin subtree; fork code lives in src/modules beside the assembly lines."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
auth = { path = "../../crates/auth" }
# rushwind framework stack (rev-pinned to the framework wave).
rushwind-authn = { git = "https://github.com/tx7do/rushwind", rev = "3f14461" }
rushwind-authn-jwt = { git = "https://github.com/tx7do/rushwind", rev = "3f14461" }
rushwind-bootstrap = { git = "https://github.com/tx7do/rushwind", rev = "3f14461" }
rushwind-http-binding = { git = "https://github.com/tx7do/rushwind", rev = "3f14461" }
rushwind-redact = { git = "https://github.com/tx7do/rushwind", rev = "3f14461" }
rushwind-storage-seaorm-support = { git = "https://github.com/tx7do/rushwind", rev = "3f14461" }
rushwind-oss-local = { git = "https://github.com/tx7do/rushwind", rev = "3f14461" }
rushwind-transport-sse = { git = "https://github.com/tx7do/rushwind", rev = "3f14461" }
rushwind-oss = { git = "https://github.com/tx7do/rushwind", rev = "3f14461" }
rushwind-oss-s3 = { git = "https://github.com/tx7do/rushwind", rev = "3f14461" }
rushwind-transport-cron = { workspace = true }
rushwind-apalis-postgres = { git = "https://github.com/tx7do/rushwind", rev = "3f14461" }
apalis-core = { workspace = true }
rushwind-transport = { git = "https://github.com/tx7do/rushwind", rev = "3f14461" }
rushwind-transport-axum = { git = "https://github.com/tx7do/rushwind", rev = "3f14461" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json", "matched-path"] }
http-body-util = "0.1"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
sea-orm = { workspace = true }
rushwind-storage-seaorm-migration = { git = "https://github.com/tx7do/rushwind", rev = "3f14461" }
redis = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
bcrypt = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
hmac = { workspace = true }
aes-gcm = { workspace = true }
rsa = { workspace = true }
lol_html = { workspace = true }
regex = { workspace = true }
lettre = { workspace = true }
base64 = { workspace = true }
pbjson = { workspace = true }
pbjson-types = { workspace = true }
prost = { workspace = true }
prost-reflect = { workspace = true }
rust-utils = { workspace = true }
captcha = { workspace = true }
futures-util = { workspace = true }
qrcode = "0.14"
hex = { workspace = true }
reqwest = { workspace = true }
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
async-trait = { workspace = true }

# 测试面：sqlite 内存库 + 进程内 Redis（CI 零服务依赖）。
# dev-dependencies 的 feature 不向下游传播——prod 构建仍只有 sqlx-postgres。
[dev-dependencies]
sea-orm = { workspace = true, features = ["sqlx-sqlite"] }
mini-redis = "0.4"
tower = { version = "0.5", features = ["util"] }
# panic_500_simulation.rs 的报告捕获面：插自定义 reporter 收
# rushwind.panic 报告（与装配默认的 TracingReporter 并存）。
rushwind-panic = { git = "https://github.com/tx7do/rushwind", rev = "3f14461" }

[build-dependencies]
biz-proto-build = { path = "../../crates/biz-proto-build" }
