[package]
name = "admin-diff"
description = "Differential replay runner: sends the same corpus to the Go reference backend and the Rust replica, judges route/envelope/CORS parity with the exemption set from docs/operator-matrix.md 搂5 and docs/binding-spec.md (testbed/README.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "admin_diff"
path = "src/lib.rs"

[[bin]]
name = "admin-diff"
path = "src/main.rs"

[dependencies]
admin = { path = "../../apps/admin" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }

[dev-dependencies]
tempfile = "3"
